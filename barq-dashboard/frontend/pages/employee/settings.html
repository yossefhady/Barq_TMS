<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Barq TMS</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../styles/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <!-- Sidebar Header -->
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <i
              class="fa-solid fa-briefcase"
              style="font-size: 32px; color: white"
            ></i>
          </div>
          <div class="sidebar-brand">
            <h1>Barq TMS</h1>
            <p>Task Management</p>
          </div>
        </div>

        <!-- Sidebar Navigation -->
        <nav class="sidebar-nav">
          <div class="nav-section">
            <a href="dashboard.html" class="nav-item">
              <span class="nav-item-icon"
                ><i class="fa-solid fa-gauge"></i
              ></span>
              <span class="nav-item-text">Dashboard</span>
            </a>
            <a href="my-tasks.html" class="nav-item">
              <span class="nav-item-icon"
                ><i class="fa-solid fa-clipboard-list"></i
              ></span>
              <span class="nav-item-text">My Tasks</span>
            </a>
            <a href="projects.html" class="nav-item" id="nav-projects">
              <span class="nav-item-icon"
                ><i class="fa-solid fa-folder-open"></i
              ></span>
              <span class="nav-item-text">Projects</span>
            </a>
            <a href="calendar.html" class="nav-item">
              <span class="nav-item-icon"
                ><i class="fa-solid fa-calendar"></i
              ></span>
              <span class="nav-item-text">Calendar</span>
            </a>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">Settings</div>
            <a href="settings.html" class="nav-item active">
              <span class="nav-item-icon"
                ><i class="fa-solid fa-gear"></i
              ></span>
              <span class="nav-item-text">Settings</span>
            </a>
            <a href="#" class="nav-item" onclick="auth.logout(); return false;">
              <span class="nav-item-icon"
                ><i class="fa-solid fa-right-from-bracket"></i
              ></span>
              <span class="nav-item-text">Logout</span>
            </a>
          </div>
        </nav>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-user-avatar">U</div>
            <div>
              <div class="sidebar-user-name">Loading...</div>
              <div class="sidebar-user-role">Employee</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <!-- Header -->
        <header class="header">
          <div class="header-left">
            <button class="menu-toggle">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="search-bar">
              <span class="search-icon"
                ><i class="fa-solid fa-magnifying-glass"></i
              ></span>
              <input type="text" class="search-input" placeholder="Search..." />
            </div>
          </div>

          <div class="header-right">
            <button class="header-btn notification-btn">
              <i class="fa-solid fa-bell"></i>
              <span class="badge">3</span>
            </button>

            <div class="user-menu">
              <div class="user-avatar">U</div>
              <span class="user-name">User Name</span>
            </div>
          </div>
        </header>

        <!-- Content Area -->
        <div class="content">
          <!-- Page Header -->
          <div style="margin-bottom: var(--space-6)">
            <h2>Settings</h2>
            <p style="color: var(--text-secondary); margin: 0">
              Manage your profile and account settings
            </p>
          </div>

          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: var(--space-6)">
            <!-- Profile Settings -->
            <div class="card">
              <div class="card-header">
                <h3>Profile Information</h3>
              </div>
              <div class="card-body">
                <form id="profileForm">
                  <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required />
                  </div>
                  <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required />
                  </div>
                  <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                      <i class="fa-solid fa-save"></i> Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <!-- Security Settings -->
            <div class="card">
              <div class="card-header">
                <h3>Security</h3>
              </div>
              <div class="card-body">
                <form id="passwordForm">
                  <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input
                      type="password"
                      id="currentPassword"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input
                      type="password"
                      id="newPassword"
                      class="form-control"
                      required
                      minlength="6"
                    />
                  </div>
                  <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input
                      type="password"
                      id="confirmPassword"
                      class="form-control"
                      required
                      minlength="6"
                    />
                  </div>
                  <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                      <i class="fa-solid fa-key"></i> Change Password
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <!-- SignalR Client -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@7.0.0/dist/browser/signalr.min.js"></script>

    <script src="../../scripts/utils/utils.js"></script>
    <script src="../../scripts/utils/components.js"></script>
    <script src="../../scripts/utils/api.js"></script>
    <script src="../../scripts/utils/auth.js"></script>

    <!-- Notification System -->
    <script src="../../scripts/utils/notifications.js"></script>
    <script src="../../scripts/components/notification-panel.js"></script>

    <script src="../../scripts/pages/employee/settings.js"></script>
  </body>
</html>
